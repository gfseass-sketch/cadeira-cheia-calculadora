<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Cadeira odontológica vazia">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF6B6B" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seatC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2B49"/>
      <stop offset="1" stop-color="#151F38"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" rx="16" fill="url(#bgC)"/>
  <path d="M0 268 H640" stroke="#1E2B49" stroke-width="2"/>
  <path d="M60 360 L200 268 M580 360 L440 268" stroke="#16203A" stroke-width="2" opacity=".7"/>
  <circle cx="330" cy="150" r="150" fill="url(#glowC)"/>

  <!-- luminária apagada -->
  <path d="M470 0 V44" stroke="#1E2B49" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="470" cy="58" rx="56" ry="19" fill="#18233D" stroke="#23304F" stroke-width="3"/>
  <ellipse cx="470" cy="60" rx="30" ry="9" fill="#23304F"/>

  <!-- cadeira vazia -->
  <g transform="translate(-46 6) scale(0.94)">
    <ellipse cx="352" cy="292" rx="94" ry="20" fill="#111B31" stroke="#23304F" stroke-width="3"/>
    <rect x="330" y="216" width="44" height="76" rx="14" fill="#16203A" stroke="#23304F" stroke-width="3"/>
    <g transform="rotate(-16 372 214)">
      <rect x="346" y="86" width="60" height="140" rx="28" fill="url(#seatC)" stroke="#2A3B60" stroke-width="3"/>
      <rect x="354" y="66" width="44" height="44" rx="20" fill="#1E2B49" stroke="#2A3B60" stroke-width="3"/>
    </g>
    <rect x="244" y="216" width="164" height="48" rx="24" fill="url(#seatC)" stroke="#2A3B60" stroke-width="3"/>
    <rect x="230" y="186" width="62" height="17" rx="8" fill="#1E2B49" stroke="#2A3B60" stroke-width="3"/>
    <rect x="240" y="203" width="14" height="26" rx="7" fill="#16203A" stroke="#2A3B60" stroke-width="3"/>
  </g>

  <!-- relógio indicando o tempo parado -->
  <g transform="translate(96 96)" opacity=".92">
    <circle r="44" fill="#121B30" stroke="#23304F" stroke-width="4"/>
    <circle r="36" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-dasharray="150 80" stroke-linecap="round" transform="rotate(-90)"/>
    <path d="M0 -22 V2 L16 12" fill="none" stroke="#E8EEF9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="4" fill="#FF6B6B"/>
  </g>

  <ellipse cx="352" cy="312" rx="120" ry="16" fill="#FF6B6B" opacity=".05"/>
</svg>
