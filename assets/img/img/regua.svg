<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="Régua de confirmação: T-72h, T-24h, T-2h, T+15min e recuperação em D+2h">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22B8FF"/>
      <stop offset=".72" stop-color="#34D3C4"/>
      <stop offset="1" stop-color="#3DDC97"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18233D"/>
      <stop offset="1" stop-color="#121B30"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- trilho -->
  <rect x="130" y="146" width="840" height="8" rx="4" fill="#1B2740"/>
  <rect x="130" y="146" width="840" height="8" rx="4" fill="url(#rail)" opacity=".9"/>
  <circle cx="970" cy="150" r="26" fill="#3DDC97" opacity=".22" filter="url(#soft)"/>
  <circle cx="130" cy="150" r="26" fill="#22B8FF" opacity=".22" filter="url(#soft)"/>

  <!-- seta do fluxo -->
  <path d="M1002 140 l16 10 -16 10" fill="none" stroke="#3DDC97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── nó 1 · T-72h ── -->
  <g>
    <text x="130" y="74" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#E8EEF9">T-72h</text>
    <text x="130" y="204" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9AAAC4">confirmação inicial</text>
    <circle cx="130" cy="150" r="27" fill="url(#nodeFill)" stroke="#22B8FF" stroke-width="4"/>
    <path d="M118 144h24M118 152h16" stroke="#22B8FF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ── nó 2 · T-24h ── -->
  <g>
    <text x="340" y="74" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#E8EEF9">T-24h</text>
    <text x="340" y="204" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9AAAC4">janela de 24h · grátis</text>
    <circle cx="340" cy="150" r="27" fill="url(#nodeFill)" stroke="#34D3C4" stroke-width="4"/>
    <path d="M328 144h24M328 152h16" stroke="#34D3C4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ── nó 3 · T-2h ── -->
  <g>
    <text x="550" y="74" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#E8EEF9">T-2h</text>
    <text x="550" y="204" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9AAAC4">última confirmação</text>
    <circle cx="550" cy="150" r="27" fill="url(#nodeFill)" stroke="#34D3C4" stroke-width="4"/>
    <path d="M538 144h24M538 152h16" stroke="#34D3C4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ── nó 4 · T+15min ── -->
  <g>
    <text x="760" y="74" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#E8EEF9">T+15min</text>
    <text x="760" y="204" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9AAAC4">na hora marcada</text>
    <circle cx="760" cy="150" r="27" fill="url(#nodeFill)" stroke="#34D3C4" stroke-width="4"/>
    <path d="M748 144h24M748 152h16" stroke="#34D3C4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ── nó 5 · D+2h recuperação ── -->
  <g>
    <text x="970" y="74" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#3DDC97">D+2h</text>
    <text x="970" y="204" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9AAAC4">recupera quem faltou</text>
    <circle cx="970" cy="150" r="27" fill="url(#nodeFill)" stroke="#3DDC97" stroke-width="4"/>
    <path d="M958 151 l8 9 16 -19" fill="none" stroke="#3DDC97" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- legenda -->
  <text x="550" y="256" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6B7C99">Mensagem fora da janela de 24h = template Utility aprovado (R$ 0,0350) · dentro = Service (grátis)</text>
</svg>
