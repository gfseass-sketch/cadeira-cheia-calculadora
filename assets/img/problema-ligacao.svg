<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Ligação de confirmação sem atendimento">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22B8FF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22B8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151F38"/>
      <stop offset="1" stop-color="#101A2E"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" rx="16" fill="url(#bgT)"/>
  <circle cx="330" cy="176" r="160" fill="url(#ringGlow)"/>

  <!-- balcão de recepção -->
  <rect x="0" y="286" width="640" height="74" fill="url(#desk)"/>
  <path d="M0 286 H640" stroke="#23304F" stroke-width="3"/>
  <rect x="40" y="304" width="150" height="12" rx="6" fill="#1E2B49"/>
  <rect x="452" y="304" width="148" height="12" rx="6" fill="#1E2B49"/>

  <!-- aparelho telefônico -->
  <g transform="translate(232 176)">
    <rect x="0" y="34" width="176" height="78" rx="18" fill="#141E36" stroke="#2A3B60" stroke-width="3"/>
    <rect x="24" y="66" width="60" height="10" rx="5" fill="#23304F"/>
    <rect x="96" y="66" width="12" height="12" rx="6" fill="#FF6B6B"/>
    <rect x="116" y="66" width="12" height="12" rx="6" fill="#23304F"/>
    <rect x="136" y="66" width="12" height="12" rx="6" fill="#23304F"/>
    <!-- fone fora do gancho -->
    <g transform="rotate(-14 88 22)">
      <path d="M-4 24 a92 34 0 0 1 184 0" fill="none" stroke="#1E2B49" stroke-width="22" stroke-linecap="round"/>
      <path d="M-4 24 a92 34 0 0 1 184 0" fill="none" stroke="#2A3B60" stroke-width="3" stroke-linecap="round"/>
      <rect x="-22" y="6" width="40" height="42" rx="16" fill="#1E2B49" stroke="#2A3B60" stroke-width="3"/>
      <rect x="170" y="6" width="40" height="42" rx="16" fill="#1E2B49" stroke="#2A3B60" stroke-width="3"/>
    </g>
  </g>

  <!-- ondas de chamada perdida -->
  <g stroke="#FF6B6B" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M446 120 a58 58 0 0 1 0 84" stroke-width="5"/>
    <path d="M474 100 a86 86 0 0 1 0 124" stroke-width="5" opacity=".65"/>
    <path d="M502 80 a114 114 0 0 1 0 164" stroke-width="5" opacity=".35"/>
  </g>
  <g transform="translate(452 162)">
    <circle r="26" fill="#121B30" stroke="#FF6B6B" stroke-width="4"/>
    <path d="M-11 -11 L11 11 M11 -11 L-11 11" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- etiqueta "45% atendem" -->
  <g transform="translate(96 96)">
    <rect x="-6" y="-30" width="176" height="60" rx="14" fill="#121B30" stroke="#23304F" stroke-width="3"/>
    <text x="16" y="-2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800" fill="#FFC24B">45%</text>
    <text x="16" y="20" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9AAAC4">atendem na 1ª tentativa</text>
  </g>
</svg>
