<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Mensagem de madrugada sem resposta">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34D3C4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#34D3C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubbleIn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2B49"/>
      <stop offset="1" stop-color="#18233D"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" rx="16" fill="url(#bgL)"/>
  <path d="M0 300 H640" stroke="#1E2B49" stroke-width="2"/>

  <!-- lua: é de madrugada -->
  <g transform="translate(536 84)" opacity=".95">
    <path d="M28 -30a34 34 0 1 0 22 60 38 38 0 0 1-22-60z" fill="#FFC24B" opacity=".85"/>
    <circle cx="-40" cy="-24" r="4" fill="#9AAAC4"/>
    <circle cx="-14" cy="-46" r="3" fill="#9AAAC4"/>
    <circle cx="-58" cy="14" r="3" fill="#9AAAC4"/>
  </g>

  <!-- celular -->
  <g transform="translate(214 44)">
    <rect x="0" y="0" width="212" height="292" rx="30" fill="#0F1729" stroke="#2A3B60" stroke-width="4"/>
    <rect x="12" y="14" width="188" height="264" rx="20" fill="#0B1220"/>
    <rect x="78" y="20" width="56" height="9" rx="4.5" fill="#23304F"/>
    <circle cx="106" cy="286" r="0" fill="none"/>

    <!-- bolha recebida (cliente) -->
    <rect x="26" y="52" width="128" height="42" rx="14" fill="url(#bubbleIn)" stroke="#2A3B60" stroke-width="2"/>
    <rect x="38" y="66" width="84" height="7" rx="3.5" fill="#9AAAC4" opacity=".8"/>
    <rect x="38" y="80" width="58" height="7" rx="3.5" fill="#6B7C99" opacity=".7"/>

    <!-- bolha enviada, sem resposta -->
    <rect x="58" y="110" width="128" height="42" rx="14" fill="#0E3A2C" stroke="#3DDC97" stroke-width="2" opacity=".75"/>
    <rect x="70" y="124" width="76" height="7" rx="3.5" fill="#3DDC97" opacity=".85"/>
    <rect x="70" y="138" width="48" height="7" rx="3.5" fill="#3DDC97" opacity=".55"/>

    <!-- relógio girando / sem resposta -->
    <g transform="translate(106 206)">
      <circle r="34" fill="#121B30" stroke="#23304F" stroke-width="3"/>
      <circle r="27" fill="none" stroke="#FFC24B" stroke-width="4" stroke-dasharray="118 60" stroke-linecap="round" transform="rotate(-90)"/>
      <path d="M0 -16 V1 L12 9" fill="none" stroke="#E8EEF9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="106" y="264" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FF6B6B">sem resposta</text>
  </g>

  <!-- seta indicando o tempo passando -->
  <g opacity=".65">
    <path d="M120 208 H184" stroke="#6B7C99" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12"/>
    <path d="M176 198 l14 10 -14 10" fill="none" stroke="#6B7C99" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M456 208 H520" stroke="#6B7C99" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12"/>
    <path d="M512 198 l14 10 -14 10" fill="none" stroke="#6B7C99" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <ellipse cx="320" cy="300" rx="170" ry="20" fill="#34D3C4" opacity=".05"/>
</svg>
