<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 508" width="720" height="508" role="img"
     aria-label="Conversa de WhatsApp de clínica odontológica: lembrete de limpeza com botões Confirmar e Remarcar, e a paciente respondendo Confirmado">
  <defs>
    <clipPath id="card">
      <rect width="720" height="508" rx="20"/>
    </clipPath>
    <style>
      .t  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m  { font-size: 15.5px; fill: #E9EDEF; }
      .s  { font-size: 12.5px; fill: #8696A0; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- fundo do card + área de chat -->
    <rect width="720" height="508" fill="#0B1220"/>

    <!-- ── cabeçalho (estilo WhatsApp) ───────────────────────────── -->
    <rect width="720" height="76" fill="#12212B"/>
    <rect y="40" width="720" height="36" fill="#12212B"/>
    <path d="M0 76 H720" stroke="#23304F" stroke-width="2"/>

    <!-- ícone WhatsApp: bolha verde com telefone -->
    <circle cx="40" cy="38" r="18" fill="#25D366"/>
    <g transform="translate(28 26)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
    </g>

    <!-- avatar da clínica com o dente -->
    <circle cx="84" cy="38" r="20" fill="#0E3A2C" stroke="#34D3C4" stroke-width="1.5"/>
    <g transform="translate(70 22.6) scale(0.7)" fill="none" stroke="#34D3C4" stroke-width="4.4" stroke-linejoin="round">
      <path d="M6 15 C6 7 14 4 20 4 C26 4 34 7 34 15 C34 23 31 31 29 36 C27 40 24 39 23 34 C22 29 21 25 20 25 C19 25 18 29 17 34 C16 39 13 40 11 36 C9 31 6 23 6 15 Z"/>
    </g>

    <text class="t" x="116" y="33" font-size="16.5" font-weight="700" fill="#E9EDEF">Clínica Sorriso · Odontologia</text>
    <circle cx="120" cy="50" r="4" fill="#25D366"/>
    <text class="t" x="132" y="54" font-size="12.5" fill="#8696A0">online · responde em minutos</text>

    <!-- kebab -->
    <g fill="#8696A0">
      <circle cx="676" cy="30" r="2.5"/><circle cx="676" cy="38" r="2.5"/><circle cx="676" cy="46" r="2.5"/>
    </g>

    <!-- ── chip de contexto (o toque da régua) ───────────────────── -->
    <rect x="295" y="94" width="130" height="26" rx="8" fill="#18233D"/>
    <text class="t" x="360" y="112" font-size="12.5" fill="#9AAAC4" text-anchor="middle">T-24h · 14:03</text>

    <!-- ── bolha recebida (a clínica) ────────────────────────────── -->
    <path d="M24 152 L12 158 L24 166 Z" fill="#18233D"/>
    <rect x="24" y="136" width="430" height="84" rx="14" fill="#18233D"/>
    <text class="t m" x="42" y="168">Oi, Ana! Sua limpeza é amanhã às 14h</text>
    <text class="t m" x="42" y="194">com a Dra. Marina. Confirma aqui em um toque?</text>

    <!-- ── botões de resposta ────────────────────────────────────── -->
    <rect x="24" y="228" width="430" height="64" rx="14" fill="#18233D"/>
    <rect x="38" y="240" width="196" height="40" rx="20" fill="#00A884"/>
    <path d="M78 260 l5 6 l9 -12" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t" x="102" y="266" font-size="14.5" font-weight="700" fill="#FFFFFF">Confirmar</text>
    <rect x="244" y="240" width="196" height="40" rx="20" fill="none" stroke="#4A5560" stroke-width="1.5"/>
    <text class="t" x="342" y="266" font-size="14.5" fill="#8696A0" text-anchor="middle">Remarcar</text>

    <!-- ── bolha enviada (a paciente) ────────────────────────────── -->
    <path d="M696 328 L708 334 L696 342 Z" fill="#005C4B"/>
    <rect x="428" y="312" width="268" height="66" rx="14" fill="#005C4B"/>
    <text class="t m" x="446" y="342">Confirmado! Até amanhã às 14h.</text>
    <g stroke="#53BDEB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M614 356 l3.5 4.5 l8 -10"/>
      <path d="M623 356 l3.5 4.5 l8 -10"/>
    </g>
    <text class="t" x="686" y="366" font-size="11" fill="#8696A0" text-anchor="end">14:05</text>

    <!-- ── confirmação do sistema ────────────────────────────────── -->
    <rect x="190" y="400" width="340" height="32" rx="16" fill="#121B30" stroke="#23304F" stroke-width="1.5"/>
    <circle cx="214" cy="416" r="8" fill="#00A884"/>
    <path d="M210 416 l3 3.5 l6 -7.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t" x="232" y="421" font-size="12.5" fill="#9AAAC4">Confirmado pela paciente — 0 ligações</text>

    <!-- ── barra de mensagem ─────────────────────────────────────── -->
    <rect x="20" y="448" width="680" height="44" rx="22" fill="#121B30" stroke="#23304F" stroke-width="1.5"/>
    <g fill="none" stroke="#6B7C99" stroke-width="1.6" stroke-linecap="round">
      <circle cx="48" cy="470" r="9"/>
      <path d="M44 473 a5 5 0 0 0 8 0"/>
    </g>
    <circle cx="45" cy="467" r="1.4" fill="#6B7C99"/>
    <circle cx="51" cy="467" r="1.4" fill="#6B7C99"/>
    <text class="t" x="70" y="475" font-size="14" fill="#6B7C99">Mensagem</text>
    <circle cx="674" cy="470" r="16" fill="#00A884"/>
    <path d="M669 462 L684 470 L669 478 Z" fill="#FFFFFF"/>
  </g>

  <rect x="1" y="1" width="718" height="506" rx="19" fill="none" stroke="#23304F" stroke-width="2"/>
</svg>
